<!DOCTYPE html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png"><link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png"><meta name="theme-color" content="#6D4AFF"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team login - Twin Forge</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet"><link href="assets/css/auth.css" rel="stylesheet"></head>
<body class="auth-body">
<main class="auth-panel">
  <a class="brand mb-4 text-white" href="../index.html"><i class="fa-solid fa-bolt"></i>Twin Forge</a>
  <h1 class="h3">Welcome back</h1><p class="small" style="color:#a9a5c4">Sign in to manage your website.</p>
  <!-- LOGIN FORM: validated in the browser (assets/js/auth.js) and again on the server (ajax/auth/login.php) -->
  <form id="loginForm" novalidate class="mt-4">
    <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="username" placeholder="you@company.com"><div class="field-error" data-error-for="email" aria-live="polite"></div></div>
    <div class="mb-2"><label class="form-label" for="password">Password</label><div class="pw-wrap"><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" maxlength="200"><button type="button" id="pwToggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button></div><div class="field-error" data-error-for="password" aria-live="polite"></div></div>
    <div class="text-end mb-3 small"><a href="forgot-password.html">Forgot password?</a></div>
    <button class="btn btn-wipe w-100" type="submit">Sign in</button>
  </form>
  <p class="small mt-4 mb-0 text-center"><a href="../index.html"><i class="fa-solid fa-arrow-left me-1"></i>Back to website</a></p>
</main>
<!-- Post-login transition (the only preloader allowed on the way to the dashboard) -->
<div class="auth-overlay" id="authOverlay" role="status"><div><div class="loader-ring"></div><p class="mb-0">Preparing your dashboard…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/toast.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/validators.js"></script><script src="assets/js/auth.js"></script>
</body></html>

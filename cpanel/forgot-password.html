<!DOCTYPE html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png"><link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png"><meta name="theme-color" content="#6D4AFF"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password - Twin Forge</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet"><link href="assets/css/auth.css" rel="stylesheet"></head>
<body class="auth-body" data-page="forgot">
<main class="auth-panel">
  <a class="brand mb-4 text-white" href="../index.html"><i class="fa-solid fa-bolt"></i>Twin Forge</a>
  <ol class="auth-steps" id="stepsBox" aria-label="Recovery progress"><li class="on" aria-current="step">Email</li><li class="">Code</li><li class="">Password</li></ol>
  <div class="auth-badge" aria-hidden="true"><i class="fa-solid fa-key"></i></div>
  <h1 class="h3">Forgot your password?</h1><p class="small auth-sub">Enter your account email and we will send you a 6-digit code.</p>
  <div class="demo-note" id="demoNote" role="status" hidden></div>
  <form id="forgotForm" novalidate class="mt-4"><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" maxlength="160"><div class="field-error" data-error-for="email" aria-live="polite"></div></div><button class="btn btn-wipe" type="submit"><span class="btn-label">Send code</span></button></form>
  <p class="small mt-4 mb-0 text-center"><a href="login.html"><i class="fa-solid fa-arrow-left me-1"></i>Back to sign in</a></p>
</main>
<script src="../assets/js/toast.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/validators.js"></script><script src="assets/js/recovery.js"></script>
</body></html>

<!DOCTYPE html><html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png"><link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png"><meta name="theme-color" content="#6D4AFF"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password - Twin Forge</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
<link href="../assets/css/main.css" rel="stylesheet"><link href="assets/css/auth.css" rel="stylesheet"></head>
<body class="auth-body" data-page="reset">
<main class="auth-panel">
  <a class="brand mb-4 text-white" href="../index.html"><i class="fa-solid fa-bolt"></i>Twin Forge</a>
  <ol class="auth-steps" id="stepsBox" aria-label="Recovery progress"><li class="done">Email</li><li class="done">Code</li><li class="on" aria-current="step">Password</li></ol>
  <div class="auth-badge" aria-hidden="true"><i class="fa-solid fa-lock"></i></div>
  <h1 class="h3">Choose a new password</h1><p class="small auth-sub">Pick something strong that you do not use anywhere else.</p>
  <div class="demo-note" id="demoNote" role="status" hidden></div>
  <form id="resetForm" novalidate class="mt-3">
    <div class="mb-2"><label class="form-label" for="new_password">New password</label><div class="pw-wrap"><input class="form-control" id="new_password" name="new_password" type="password" autocomplete="new-password" maxlength="200"><button type="button" id="pwToggle" aria-label="Show passwords"><i class="fa-solid fa-eye"></i></button></div><div class="field-error" data-error-for="new_password" aria-live="polite"></div>
      <div class="meter" aria-hidden="true"><i id="meterFill"></i></div><div class="small text-end auth-sub" id="meterLabel" aria-live="polite"></div></div>
    <ul class="rules" id="rules"><li data-rule="len"><i class="fa-regular fa-circle"></i> At least 10 characters</li><li data-rule="letter"><i class="fa-regular fa-circle"></i> Contains a letter</li><li data-rule="num"><i class="fa-regular fa-circle"></i> Contains a number</li></ul>
    <div class="mb-3"><label class="form-label" for="confirm_password">Confirm password</label><input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" maxlength="200"><div class="field-error" data-error-for="confirm_password" aria-live="polite"></div></div><button class="btn btn-wipe" type="submit"><span class="btn-label">Reset password</span></button></form>
  <div id="doneBox" class="text-center py-3" hidden role="status"><div class="done-check"><i class="fa-solid fa-check"></i></div><h2 class="h4">Password updated</h2><p class="small auth-sub mb-3">Taking you to the sign-in page…</p><a href="login.html">Sign in now</a></div>
  
</main>
<script src="../assets/js/toast.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/validators.js"></script><script src="assets/js/recovery.js"></script>
</body></html>
